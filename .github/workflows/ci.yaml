name: Weather Prediction CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
          
      - name: Create directories
        run: |
          mkdir -p data/db
          mkdir -p logs/plots
          mkdir -p model/registry
          
      - name: Debug info
        run: |
          pwd
          ls -la
          python --version
          pip list
          
      - name: Run tests with verbose output
        run: |
          python -m pytest tests/ -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/weather-api:latest
            ghcr.io/${{ github.repository_owner }}/weather-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-container:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Pull Docker image
        run: docker pull ghcr.io/${{ github.repository_owner }}/weather-api:${{ github.sha }}
        
      - name: Run Docker container
        run: |
          docker run -d -p 8000:8000 --name weather-api ghcr.io/${{ github.repository_owner }}/weather-api:${{ github.sha }}
          sleep 15  # Attendre que le conteneur démarre
          
      - name: Test API endpoints
        run: |
          curl -f http://localhost:8000/health || exit 1
          curl -f http://localhost:8000/version || exit 1
          echo "Container tests passed!"